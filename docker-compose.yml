services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: waypointflow
      POSTGRES_USER: waypointflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_demo_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waypointflow -d waypointflow"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgresql://waypointflow:${POSTGRES_PASSWORD:-local_demo_password}@db:5432/waypointflow
      APP_SECRET: ${APP_SECRET:-local-demo-secret-change-before-public-deployment}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-WaypointDemo2026!}
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "python seed.py && uvicorn main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  postgres_data:
